# Trusted writer for the findings ledger (.pr-reviewer/findings/).
# Runs ONLY in base-branch contexts, never in a fork PR's context, so an
# untrusted contributor can never write the reviewer's memory.
name: review-memory

on:
  # A merged PR: harvest its review findings into the ledger.
  pull_request:
    types: [closed]
  # A /dismiss or /reopen command on any issue/PR comment.
  issue_comment:
    types: [created]

permissions:
  contents: write        # commit ledger updates to the default branch
  issues: write          # confirm/deny command comments
  pull-requests: read

jobs:
  harvest:
    # Only when a PR actually merged.
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r requirements.txt
      - run: python ledger_sync.py harvest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  command:
    # Only comments that look like a ledger command (cheap pre-filter; the
    # script re-parses and authorizes).
    if: >
      github.event_name == 'issue_comment' &&
      (startsWith(github.event.comment.body, '/dismiss') ||
       startsWith(github.event.comment.body, '/reopen') ||
       startsWith(github.event.comment.body, '/fix'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r requirements.txt
      - run: python ledger_sync.py comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # /fix uses `gh pr ready`
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
