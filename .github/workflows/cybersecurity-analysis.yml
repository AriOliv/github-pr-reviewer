# GitHub Actions workflow: whole-repository cybersecurity analysis.
# Runs the managed-agent security-review skill against the entire codebase and
# writes the findings to the job summary. Triggered manually, weekly, and on
# pushes to the default branch.
name: cybersecurity-analysis

on:
  workflow_dispatch:
    inputs:
      review_skill:
        description: "Review skill (folder under skills/)"
        required: false
        default: "security-review"
      fail_on:
        description: "Fail the job on findings at/above this severity (critical|high|medium|low|info|never)"
        required: false
        default: "never"
  schedule:
    # Weekly on Mondays at 06:17 UTC (off the hour to avoid the scheduler rush).
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write          # update the tracking issue (push/schedule/dispatch runs)
  pull-requests: write   # comment findings on the PR (pull_request runs)

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run cybersecurity analysis
        run: python security_scan.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_SKILL: ${{ inputs.review_skill || 'security-review' }}
          FAIL_ON: ${{ inputs.fail_on || 'never' }}
          GEMINI_MODEL: "gemini-3.6-flash"
          # Optional: route model calls through a LiteLLM proxy for cost tracking.
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
