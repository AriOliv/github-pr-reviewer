# GitHub Actions workflow: whole-repository cybersecurity analysis.
# Runs the managed-agent security-review skill against the entire codebase,
# writes findings to the job summary + the tracking issue, PERSISTS them to the
# ledger, and opens draft fix PRs for high/critical findings.
#
# Runs only in trusted base-branch contexts (manual, weekly, push to main) — no
# pull_request trigger, so every run can write the ledger safely and a fork
# never reaches this workflow. PR diffs are already covered by pr-review.
name: cybersecurity-analysis

on:
  workflow_dispatch:
    inputs:
      review_skill:
        description: "Review skill (folder under skills/)"
        required: false
        default: "security-review"
      fail_on:
        description: "Fail the job on findings at/above this severity (critical|high|medium|low|info|never)"
        required: false
        default: "never"
  schedule:
    # Weekly on Mondays at 06:17 UTC (off the hour to avoid the scheduler rush).
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    # The scan commits the ledger; ignore ledger-only pushes so it doesn't
    # retrigger itself.
    paths-ignore:
      - ".pr-reviewer/**"

permissions:
  contents: write        # persist the findings ledger
  issues: write          # update the tracking issue
  pull-requests: write   # open draft fix PRs

jobs:
  security-scan:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run cybersecurity analysis
        run: python security_scan.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVIEW_SKILL: ${{ inputs.review_skill || 'security-review' }}
          FAIL_ON: ${{ inputs.fail_on || 'never' }}
          GEMINI_MODEL: "gemini-3.6-flash"
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}

      - name: Open draft fix PRs for high/critical findings
        run: python fix_findings.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GEMINI_MODEL: "gemini-3.6-flash"
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          # Only draft fixes for high+ by default; lower severities stay in the
          # ledger and can be fixed on demand with `/fix <id>`.
          FIX_DRAFT_MIN_SEVERITY: "high"
          FIX_MAX_DRAFTS: "5"
